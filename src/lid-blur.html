<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html,body {
  margin:0; padding:0; width:100%; height:100%;
  background:transparent; overflow:hidden; pointer-events:none;
}
canvas { position:fixed; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="lid-motion.js"></script>
<script>
'use strict';
// A transparent window can't blur the real desktop behind it, so each gesture
// gets a snapshot (see main.js) and this page draws a blurred copy over the top.
//
// The snapshot is blurred ONCE per gesture into a few levels. Every frame then
// only blends between two neighbouring levels per pixel, so animating the blur
// costs a handful of texture reads — re-running a blur each frame is what made
// the old CSS version stutter. Levels clamp at the image edge, so corners get
// the same blur as the middle instead of fading out to the sharp desktop.
//
// The lid is treated as a window onto a desktop that stays where it was when
// the gesture began: each screen pixel is traced from the viewer's eye through
// its real position on the tilted lid onto that fixed plane. As the lid turns
// the picture holds its ground, and past its edges there's only dark.
//
// Blur follows the same tilt. It's even left to right, starts just above the
// hinge and is strongest at the top edge, the part of the lid that has moved
// the most.

const LEVELS    = [0, 0.002, 0.006, 0.016, 0.040]; // Gaussian sigma, fraction of height
const BLUR_GAIN = 0.065;  // top-edge sigma, fraction of height, at a 90° tilt
const BLUR_FOOT = 0.08;   // height above the hinge where blur begins
const EYE_Y     = 0.65;   // viewer's eye above the hinge, in screen heights
const EYE_Z     = 1.6;    // viewer's distance from the screen, in screen heights
const PERSPECTIVE = true; // true narrows the top as the lid tilts (a keystone);
                           // false keeps the picture's width and only holds height
const FADE_TILT = 0.035;  // radians (~2°): below this the overlay fades out, so a
                          // nearly-flat half-res snapshot never sits on top of
                          // the real desktop as a visible flash

const VERT = `#version 300 es
const vec2 CORNERS[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
void main() { gl_Position = vec4(CORNERS[gl_VertexID], 0.0, 1.0); }`;

// One axis of a separable Gaussian, resampling the source onto the destination.
const BLUR_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2  uDestSize;
uniform vec2  uAxis;
uniform float uSigma;          // destination texels
out vec4 fragColor;
void main() {
  vec2 uv    = gl_FragCoord.xy / uDestSize;
  vec2 texel = uAxis / uDestSize;
  float reach = min(ceil(uSigma * 3.0), 24.0);
  float k = 1.0 / (2.0 * uSigma * uSigma);
  vec4 sum = vec4(0.0);
  float total = 0.0;
  for (int i = -24; i <= 24; i++) {
    float d = float(i);
    if (abs(d) > reach) continue;
    float w = exp(-d * d * k);
    sum += texture(uSrc, uv + texel * d) * w;
    total += w;
  }
  fragColor = sum / total;
}`;

const COMPOSITE_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uL0, uL1, uL2, uL3, uL4;
uniform float uS1, uS2, uS3, uS4;
uniform vec2  uRes;
uniform float uTilt, uGain, uFoot, uEyeY, uEyeZ, uFade, uPerspective;
out vec4 fragColor;

const vec3 VOID = vec3(0.02, 0.035, 0.05);

vec3 tap(sampler2D t, vec2 uv) { return texture(t, uv).rgb; }

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 screen = gl_FragCoord.xy / uRes;          // y = 0 at the bottom, by the hinge
  float h = screen.y;
  float a = clamp(uTilt, -0.65, 1.25);

  // Where this pixel physically is on the tilted lid (screen heights, hinge at
  // the origin, z toward the viewer), then where the eye's line through it
  // lands on the fixed desktop plane z = 0.
  vec3 lid  = vec3((screen.x - 0.5) * aspect, h * cos(a), h * sin(a));
  vec3 eye  = vec3(0.0, uEyeY, uEyeZ);
  float t   = uPerspective > 0.5 ? uEyeZ / max(0.25, uEyeZ - lid.z) : 1.0;
  vec3 hit  = eye + t * (lid - eye);
  vec2 uv   = vec2(hit.x / aspect + 0.5, 1.0 - hit.y);   // textures hold the top row first

  float sigma = uGain * smoothstep(uFoot, 1.0, h) * abs(sin(a));

  vec3 c;
  if      (sigma < uS1) c = mix(tap(uL0, uv), tap(uL1, uv), sigma / uS1);
  else if (sigma < uS2) c = mix(tap(uL1, uv), tap(uL2, uv), (sigma - uS1) / (uS2 - uS1));
  else if (sigma < uS3) c = mix(tap(uL2, uv), tap(uL3, uv), (sigma - uS2) / (uS3 - uS2));
  else                  c = mix(tap(uL3, uv), tap(uL4, uv), clamp((sigma - uS3) / (uS4 - uS3), 0.0, 1.0));

  // Past the picture's edge, fade to dark over the same blur width instead of
  // a hard cut; the levels clamp at the edge, so the colour runs out softly.
  vec2 feather = max(vec2(3.0 * min(sigma, uS4)) * vec2(1.0 / aspect, 1.0), fwidth(uv));
  vec2 inside  = smoothstep(-feather, feather, uv) * (1.0 - smoothstep(1.0 - feather, 1.0 + feather, uv));
  c = mix(VOID, c, inside.x * inside.y);

  // Wide soft gradients band on 8-bit panels; a little noise hides the steps.
  float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  c = clamp(c + (n - 0.5) / 255.0, 0.0, 1.0);

  float alpha = smoothstep(0.0, uFade, abs(uTilt));
  fragColor = vec4(c * alpha, alpha);
}`;

const canvas = document.getElementById('gl');
const motion = LidMotion.create();

let gl = null, blurProg = null, compProg = null, halfFloat = false;
let srcTex = null, levelTex = [], levelTargets = [];
let running = false, lastTs = 0, shotToken = 0;

function compile(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function makeProgram(fragSource) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSource));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

function makeTexture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

// Half-float levels keep heavy blur from banding; plain 8-bit is the fallback.
function makeTarget(w, h, useHalf) {
  const tex = makeTexture();
  if (useHalf) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else         gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8,   w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  return { tex, fb, w, h, ok };
}

function freeTarget(t) {
  gl.deleteFramebuffer(t.fb);
  gl.deleteTexture(t.tex);
}

function initGL() {
  gl = canvas.getContext('webgl2', {
    alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false,
  });
  if (!gl) { console.log('[lid-blur] WebGL2 unavailable, effect disabled'); return; }

  blurProg = makeProgram(BLUR_FRAG);
  compProg = makeProgram(COMPOSITE_FRAG);

  gl.bindVertexArray(gl.createVertexArray());

  halfFloat = false;
  if (gl.getExtension('EXT_color_buffer_float')) {
    const probe = makeTarget(1, 1, true);
    halfFloat = probe.ok;
    freeTarget(probe);
  }

  gl.useProgram(compProg.p);
  for (let i = 0; i < 5; i++) gl.uniform1i(compProg.u['uL' + i], i);
  for (let i = 1; i < 5; i++) gl.uniform1f(compProg.u['uS' + i], LEVELS[i]);
  gl.uniform1f(compProg.u.uGain, BLUR_GAIN);
  gl.uniform1f(compProg.u.uFoot, BLUR_FOOT);
  gl.uniform1f(compProg.u.uEyeY, EYE_Y);
  gl.uniform1f(compProg.u.uEyeZ, EYE_Z);
  gl.uniform1f(compProg.u.uFade, FADE_TILT);
  gl.uniform1f(compProg.u.uPerspective, PERSPECTIVE ? 1 : 0);

  gl.useProgram(blurProg.p);
  gl.uniform1i(blurProg.u.uSrc, 0);

  srcTex = null; levelTex = []; levelTargets = [];
}

function blurPass(src, dest, ax, ay, sigma) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dest.fb);
  gl.viewport(0, 0, dest.w, dest.h);
  gl.useProgram(blurProg.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src);
  gl.uniform2f(blurProg.u.uDestSize, dest.w, dest.h);
  gl.uniform2f(blurProg.u.uAxis, ax, ay);
  gl.uniform1f(blurProg.u.uSigma, Math.max(0.5, sigma));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Each level blurs the one before it (Gaussians add in quadrature), at a
// resolution just high enough to hold that blur. Large blurs run on small
// textures, so the whole set is cheap, and upscaling a blurred texture with
// linear filtering is invisible.
function buildLevels(w, h) {
  for (const t of levelTargets) freeTarget(t);
  levelTargets = [];
  levelTex = [srcTex];

  let prevTex = srcTex, prevScale = 1, prevSigma = 0;   // sigma in snapshot pixels
  for (let k = 1; k < LEVELS.length; k++) {
    const sigma = LEVELS[k] * h;
    const add   = Math.sqrt(Math.max(sigma * sigma - prevSigma * prevSigma, 0.25));
    const scale = Math.min(prevScale, Math.max(prevScale / 2, 3 / add));
    const dw = Math.max(1, Math.round(w * scale));
    const dh = Math.max(1, Math.round(h * scale));

    const tmp = makeTarget(dw, dh, halfFloat);
    const out = makeTarget(dw, dh, halfFloat);
    blurPass(prevTex, tmp, 1, 0, add * dw / w);
    blurPass(tmp.tex, out, 0, 1, add * dh / h);
    freeTarget(tmp);

    levelTargets.push(out);
    levelTex.push(out.tex);
    prevTex = out.tex; prevScale = scale; prevSigma = sigma;
  }
}

function uploadShot(img) {
  if (!srcTex) srcTex = makeTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
}

function fitCanvas() {
  const w = Math.round(innerWidth  * devicePixelRatio);
  const h = Math.round(innerHeight * devicePixelRatio);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

function draw(tilt) {
  fitCanvas();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(compProg.p);
  for (let i = 0; i < 5; i++) {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, levelTex[i]);
  }
  gl.uniform2f(compProg.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(compProg.u.uTilt, tilt);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function clearCanvas() {
  if (!gl || gl.isContextLost()) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

// Wait two frames so the cleared canvas actually reaches the screen before the
// window is pulled — otherwise the next gesture flashes this one's last frame.
function reportIdle() {
  requestAnimationFrame(() => requestAnimationFrame(() => window.api?.hingeIdle?.()));
}

function frame(ts) {
  if (!running) return;
  const dt = lastTs ? Math.min(50, ts - lastTs) : 16;
  lastTs = ts;
  motion.step(dt);
  if (motion.idle()) {
    running = false; lastTs = 0;
    clearCanvas();
    reportIdle();
    return;
  }
  draw(motion.tilt());
  requestAnimationFrame(frame);
}

window.api?.onHingeAngle?.(deg => motion.sample(deg));

window.api?.onHingeShot?.(async shot => {
  const token = ++shotToken;
  running = false;
  clearCanvas();
  if (!gl || gl.isContextLost()) { window.api?.hingeIdle?.(); return; }
  try {
    const img = new Image();
    img.src = shot.dataUrl;
    await img.decode();
    if (token !== shotToken || gl.isContextLost()) return;
    uploadShot(img);
    buildLevels(img.naturalWidth, img.naturalHeight);
  } catch (e) {
    console.log('[lid-blur] could not prepare snapshot:', e.message);
    window.api?.hingeIdle?.();
    return;
  }
  motion.reset(shot.anchor, shot.angle);
  running = true;
  lastTs = 0;
  requestAnimationFrame(frame);
});

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  if (running) { running = false; window.api?.hingeIdle?.(); }
});
canvas.addEventListener('webglcontextrestored', () => {
  try { initGL(); } catch (e) { console.log('[lid-blur] WebGL restore failed:', e.message); gl = null; }
});

try {
  initGL();
  fitCanvas();
  clearCanvas();
} catch (e) {
  console.log('[lid-blur] WebGL setup failed, effect disabled:', e.message);
  gl = null;
}
</script>
</body>
</html>
