<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html,body {
  margin:0; padding:0; width:100vw; height:100vh;
  background:transparent; overflow:hidden; pointer-events:none;
}
/* A snapshot of the desktop, blurred in place. backdrop-filter can't touch the
   real desktop from a transparent window, but an <img> inside the page blurs
   normally — so the desktop gets copied in and blurred here.

   Drawn at half size and scaled back up. A big CSS blur costs roughly the
   square of its radius times the pixel count, and a full-screen 55px blur every
   frame was heavy enough to drop frames. Blurring a half-size layer costs a
   quarter of that, and since the capture is already half-resolution this maps
   about 1:1 — no visible loss.

   No CSS transitions on purpose — every frame comes from the rAF loop below,
   so transitions would only fight it. */
#shot {
  position:fixed; left:-3%; top:-3%;
  width:53%; height:53%;
  transform:scale(2);          /* must match SCALE below */
  transform-origin:0 0;
  object-fit:fill;
  will-change:filter, opacity;
}
/* Black closing in around the edges — the middle of the screen stays readable,
   it's the border that goes dark.

   The gradient is fixed and only its opacity animates. Opacity is a
   compositor-only property, so it can't trigger a repaint and stays smooth;
   rebuilding the gradient string each frame repainted the whole screen. */
#black {
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(ellipse 92% 92% at 50% 60%,
    rgba(0,0,0,0)    58%,
    rgba(0,0,0,0.14) 76%,
    rgba(0,0,0,0.48) 90%,
    rgba(0,0,0,0.88) 100%);
  will-change:opacity;
}
/* The last stretch before the lid meets flush: the whole panel goes to black,
   so it reads as the backlight dying rather than the picture being cut off. */
#blackout {
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  background:#000;
  will-change:opacity;
}
</style>
</head>
<body>
<img id="shot" alt="">
<div id="black"></div>
<div id="blackout"></div>
<script>
const shot     = document.getElementById('shot');
const black    = document.getElementById('black');
const blackout = document.getElementById('blackout');

const MIN_BLUR = 28;   // px the moment the curtain appears
const MAX_BLUR = 85;   // px once fully closed
const SCALE    = 2;    // must match the CSS transform above
const FEATHER  = 30;   // curtain edge softness, in % of screen height
const SPAN     = 100 + FEATHER;

// Coverage and radius are both pushed hard up front. Ramping them linearly
// meant the first half of the lid's travel only blurred a thin strip at the
// top, so the effect was barely there for most of the movement you actually
// watch.
const VIS_EASE = 0.55;

// Thresholds are written in degrees because that's how the lid is actually
// thought about. Converting needs the same mapping main.js uses — keep these
// two in step with HINGE_CLEAR / HINGE_CLOSED over there.
const HINGE_CLEAR  = 120;
const HINGE_CLOSED = 5;
const atDeg = d => (HINGE_CLEAR - d) / (HINGE_CLEAR - HINGE_CLOSED);

const BLACK_START    = atDeg(60);  // edges start darkening as the lid passes 60°
const BLACKOUT_START = atDeg(35);  // panel goes fully black on the way to shut

// Spring instead of a plain ease: it accelerates and settles the way something
// physical does, which is what reads as "liquid". Critically damped, so it
// glides into place without wobbling past it.
const STIFFNESS = 190;
const DAMPING   = 2 * Math.sqrt(190);   // critical damping
const TAU_FADE  = 320;                  // settle fade stays a simple ease

let target = 0, cur = 0, vel = 0;   // curtain coverage, 0..1
let fadeTo = 0, fade = 0;           // 1 = shown, 0 = faded off after settling
let hasShot = false, isSettled = true, raf = null, lastTs = 0;

// Nothing is revealed until there's a decoded image to reveal. Fading in before
// the snapshot had decoded meant the picture snapped into view the instant it
// was ready, instead of easing in.
function updateFade() {
  fadeTo = (!isSettled && hasShot) ? 1 : 0;
}

// Writing a style property costs a repaint even when the value is unchanged, so
// each is only touched when it actually moves.
let lastCur = -1, lastFade = -1, lastBlack = -1, lastBlackout = -1;

function apply() {
  // Changing blur or mask repaints the layer, so skip sub-perceptual steps —
  // fewer repaints per second leaves more headroom to hit frame deadlines.
  if (Math.abs(cur - lastCur) > 0.004) {
    lastCur = cur;

    const e     = Math.pow(cur, VIS_EASE);
    const cov   = e * SPAN;
    const solid = Math.max(0, cov - FEATHER);
    const mask  = `linear-gradient(to bottom, #000 0%, #000 ${solid.toFixed(2)}%, transparent ${cov.toFixed(2)}%)`;
    shot.style.webkitMaskImage = mask;
    shot.style.maskImage       = mask;

    // Radius is divided by the scale factor because the blur is applied before
    // the element is scaled up. The saturation lift is the Apple vibrancy
    // trick — blurred pixels go muddy, and pushing colour back in is what keeps
    // it looking like frosted glass rather than grey soup.
    shot.style.filter =
      `blur(${((MIN_BLUR + e * (MAX_BLUR - MIN_BLUR)) / SCALE).toFixed(2)}px) ` +
      `saturate(${(1 + e * 0.5).toFixed(3)})`;
  }

  if (Math.abs(fade - lastFade) > 0.001) {
    lastFade = fade;
    shot.style.opacity = fade.toFixed(3);
  }

  // Vignette strength rides on both how far the lid is over and the settle
  // fade, as a single opacity write. Eased so it comes in gently.
  const bt    = Math.max(0, (cur - BLACK_START) / (1 - BLACK_START));
  const bOpac = bt * bt * (3 - 2 * bt) * fade;   // smoothstep
  if (Math.abs(bOpac - lastBlack) > 0.001) {
    lastBlack = bOpac;
    black.style.opacity = bOpac.toFixed(3);
  }

  const kt    = Math.max(0, (cur - BLACKOUT_START) / (1 - BLACKOUT_START));
  const kOpac = kt * kt * (3 - 2 * kt) * fade;   // smoothstep
  if (Math.abs(kOpac - lastBlackout) > 0.001) {
    lastBlackout = kOpac;
    blackout.style.opacity = kOpac.toFixed(3);
  }
}

// The sensor only speaks ~10 times a second in whole degrees; this fills in the
// frames between so it glides instead of stepping. It converges and stops on
// its own, so a stationary lid costs nothing.
function tick(ts) {
  const dtMs = Math.min(32, lastTs ? ts - lastTs : 16);
  lastTs = ts;
  const dt = dtMs / 1000;

  const accel = STIFFNESS * (target - cur) - DAMPING * vel;
  vel += accel * dt;
  cur += vel * dt;

  fade += (fadeTo - fade) * (1 - Math.exp(-dtMs / TAU_FADE));
  apply();

  const moving = Math.abs(target - cur) > 0.0008 || Math.abs(vel) > 0.0008;
  if (moving || Math.abs(fadeTo - fade) > 0.002) {
    raf = requestAnimationFrame(tick);
  } else {
    cur = target; vel = 0; fade = fadeTo; apply();
    raf = null; lastTs = 0;
    // Only once it has actually finished animating AND is invisible is it safe
    // for the main process to pull the window. Hiding on a timer used to cut
    // the fade off partway, which looked like it vanished.
    if (fade < 0.01 || cur < 0.002) window.api?.hingeIdle?.();
  }
}

function kick() {
  if (raf === null) { lastTs = 0; raf = requestAnimationFrame(tick); }
}

window.api?.onHingeShot?.(dataUrl => {
  if (!dataUrl) {
    shot.removeAttribute('src');
    hasShot = false;
    target = cur = 0; vel = 0;
    updateFade(); apply();
    return;
  }
  // Decode off-screen first, then swap it in — assigning straight to the
  // visible element lets it appear mid-fade the moment decoding lands.
  const pre = new Image();
  pre.onload = () => {
    shot.src = dataUrl;
    hasShot = true;
    updateFade();
    kick();
  };
  pre.src = dataUrl;
});

window.api?.onHingeProgress?.(p => {
  if (!hasShot) return;
  target = Math.max(0, Math.min(1, p));
  kick();
});

// Lid parked: ease it off and hand the screen back. Moving again brings it
// straight in.
window.api?.onHingeSettled?.(s => {
  isSettled = !!s;
  updateFade();
  kick();
});

apply();
</script>
</body>
</html>
